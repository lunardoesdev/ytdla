[project]
name = "ytdla"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Lunar", email = "lunarlifeburst@gmail.com"},
]
dependencies = []
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[project.scripts]
ytdla = "ytdla:main"